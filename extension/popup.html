<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
           background: #15151b; color: #e7e7ec; padding: 14px 16px; }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
    .sub { font-size: 11px; color: #8b8d98; margin: 0 0 12px; line-height: 1.5; }
    label.row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 12px; }
    .lbl { font-size: 11px; color: #b9b9c4; font-weight: 600; margin-bottom: 6px; display: block; }
    textarea { width: 100%; box-sizing: border-box; height: 90px; resize: vertical;
               background: rgba(255,255,255,0.05); color: #e7e7ec; border: 1px solid rgba(255,255,255,0.14);
               border-radius: 8px; padding: 8px; font-size: 12px; font-family: inherit; }
    button { margin-top: 12px; width: 100%; background: #a78bfa; color: #15151b; border: none;
             border-radius: 8px; padding: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button:hover { background: #b9a4ff; }
    .saved { font-size: 11px; color: #10b981; margin-top: 8px; min-height: 14px; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: #a78bfa; }
  </style>
</head>
<body>
  <h1>Déjà Bridge</h1>
  <p class="sub">Salta la cattura su login e siti esclusi. Canale locale, nessuna porta di rete.</p>
  <label class="row"><input type="checkbox" id="enabled"> Attivo</label>
  <span class="lbl">Domini da non catturare (uno per riga)</span>
  <textarea id="excluded" placeholder="bank.com&#10;mail.google.com"></textarea>
  <button id="save">Salva</button>
  <div class="saved" id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
